<svg viewBox="0 0 357 523" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="overlayBgD" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f7f2e6"/>
      <stop offset="100%" stop-color="#e8dec5"/>
    </linearGradient>
    <filter id="shadow3">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="357" height="523" fill="url(#overlayBgD)" rx="14"/>

  <!-- Geometric border -->
  <rect x="20" y="20" width="317" height="483" fill="none" stroke="#C29A4D" stroke-width="1" opacity="0.4" rx="8"/>

  <!-- Multiple device cluster -->

  <!-- Tablet (bottom layer) -->
  <g transform="translate(178,330) rotate(-6)" filter="url(#shadow3)">
    <rect x="-90" y="-65" width="180" height="130" rx="8" fill="#1a1a1a"/>
    <rect x="-85" y="-60" width="170" height="120" rx="4" fill="#2d4933"/>
    <!-- App icons grid -->
    <g fill="#fff" opacity="0.7">
      <rect x="-70" y="-45" width="22" height="22" rx="6" fill="#B1040E"/>
      <rect x="-40" y="-45" width="22" height="22" rx="6" fill="#C29A4D"/>
      <rect x="-10" y="-45" width="22" height="22" rx="6" fill="#B1040E"/>
      <rect x="20" y="-45" width="22" height="22" rx="6" fill="#fff"/>
      <rect x="50" y="-45" width="22" height="22" rx="6" fill="#C29A4D"/>

      <rect x="-70" y="-15" width="22" height="22" rx="6" fill="#C29A4D"/>
      <rect x="-40" y="-15" width="22" height="22" rx="6" fill="#fff"/>
      <rect x="-10" y="-15" width="22" height="22" rx="6" fill="#B1040E"/>
      <rect x="20" y="-15" width="22" height="22" rx="6" fill="#C29A4D"/>
      <rect x="50" y="-15" width="22" height="22" rx="6" fill="#B1040E"/>

      <rect x="-70" y="15" width="22" height="22" rx="6" fill="#fff"/>
      <rect x="-40" y="15" width="22" height="22" rx="6" fill="#B1040E"/>
      <rect x="-10" y="15" width="22" height="22" rx="6" fill="#C29A4D"/>
      <rect x="20" y="15" width="22" height="22" rx="6" fill="#fff"/>
      <rect x="50" y="15" width="22" height="22" rx="6" fill="#C29A4D"/>
    </g>
  </g>

  <!-- Phone (foreground) -->
  <g transform="translate(150,180) rotate(8)" filter="url(#shadow3)">
    <rect x="-50" y="-95" width="100" height="180" rx="14" fill="#1a1a1a"/>
    <rect x="-46" y="-91" width="92" height="172" rx="10" fill="#0a0a0a"/>

    <!-- Video screen content -->
    <rect x="-42" y="-85" width="84" height="50" rx="4" fill="#B1040E" opacity="0.85"/>
    <!-- Play triangle -->
    <path d="M -8,-65 L 10,-58 L -8,-50 Z" fill="#fff"/>

    <!-- Text bars below video -->
    <rect x="-42" y="-25" width="84" height="3" rx="1" fill="#fff" opacity="0.7"/>
    <rect x="-42" y="-15" width="60" height="3" rx="1" fill="#fff" opacity="0.5"/>
    <rect x="-42" y="-5" width="70" height="3" rx="1" fill="#fff" opacity="0.5"/>

    <!-- Comment-style rows -->
    <circle cx="-35" cy="20" r="6" fill="#3a3a3a"/>
    <rect x="-22" y="18" width="50" height="2" rx="1" fill="#fff" opacity="0.4"/>
    <rect x="-22" y="24" width="40" height="2" rx="1" fill="#fff" opacity="0.4"/>

    <circle cx="-35" cy="45" r="6" fill="#3a3a3a"/>
    <rect x="-22" y="43" width="55" height="2" rx="1" fill="#fff" opacity="0.4"/>
    <rect x="-22" y="49" width="35" height="2" rx="1" fill="#fff" opacity="0.4"/>

    <!-- Bottom indicator -->
    <rect x="-15" y="65" width="30" height="2" rx="1" fill="#666"/>
  </g>

  <!-- Warning bubble with X (floating) -->
  <g transform="translate(280,140)" filter="url(#shadow3)">
    <circle r="32" fill="#B1040E"/>
    <path d="M -12,-12 L 12,12 M 12,-12 L -12,12" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- "30M+" badge -->
  <g transform="translate(80,80)" filter="url(#shadow3)">
    <circle r="38" fill="#2d4933"/>
    <text x="0" y="-2" font-family="Arial, sans-serif" font-size="16" font-weight="800" fill="#fff" text-anchor="middle">30M+</text>
    <text x="0" y="14" font-family="Arial, sans-serif" font-size="8" font-weight="600" fill="#C29A4D" text-anchor="middle">SUBS</text>
  </g>

  <!-- Bottom banner -->
  <g transform="translate(178,468)" filter="url(#shadow3)">
    <rect x="-130" y="-22" width="260" height="44" rx="22" fill="#2d4933"/>
    <text x="0" y="6" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">منصات متعددة • محتوى مستمر</text>
  </g>

  <!-- Decorative tech dots -->
  <g opacity="0.5">
    <circle cx="60" cy="240" r="3" fill="#B1040E"/>
    <circle cx="50" cy="260" r="2" fill="#C29A4D"/>
    <circle cx="320" cy="320" r="3" fill="#B1040E"/>
    <circle cx="310" cy="340" r="2" fill="#C29A4D"/>
    <circle cx="40" cy="400" r="2" fill="#C29A4D"/>
    <circle cx="60" cy="80" r="1.5" fill="#C29A4D"/>
  </g>
</svg>
